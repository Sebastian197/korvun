# Release pipeline (ADR-0025, Stage 15). Build-time only: it runs GoReleaser on a
# pushed SemVer tag to produce the GitHub Release (binaries x6, checksums,
# archives, changelog, SBOM). Tags are pushed BY HAND — a tag pushed from inside
# an Action does not retrigger workflows, and the SemVer bump is a deliberate
# decision, not an automated one.
#
# A manual `workflow_dispatch` runs the SAME job as a `--snapshot` DRY-RUN
# (ADR-0026): it builds, signs checksums.txt with keyless cosign (real Fulcio/
# Rekor OIDC), and attests build provenance — exercising the id-token/signing/
# provenance path in the real Actions environment — but publishes NO GitHub
# Release and consumes NO tag (snapshot ignores the `release:` section). Used to
# validate the trust machinery before the first real tag.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Snapshot dry-run only (no release published, no tag consumed). Must stay true — a real release is published by pushing a v* tag.'
        type: boolean
        default: true

# Least privilege (Scorecard Token-Permissions, High): the default token is
# read-only for every job; the one job that needs write scopes elevates them at
# the job level, not here.
permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # Only the release job needs write scopes:
    permissions:
      contents: write # create the GitHub Release and upload its assets
      id-token: write # keyless cosign: mint an OIDC token to sign checksums.txt (ADR-0026)
      attestations: write # SLSA build provenance attestation for the checksums (ADR-0026)
    steps:
      # A manual dispatch is dry-run only: a real, published release must come
      # from a pushed v* tag (there is no tag context to publish on dispatch).
      - name: Guard — dispatch must be a dry-run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true
        run: |
          echo "::error::Manual dispatch supports dry_run=true only; publish a real release by pushing a v* tag."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so the changelog can diff from the previous tag

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Syft generates the per-release SBOM (ADR-0025 §6).
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      # cosign signs checksums.txt keyless via the workflow OIDC identity (ADR-0026).
      # Pin the cosign BINARY to v2.6.3 (installer SHA stays v4.1.2): cosign v3
      # defaults to --new-bundle-format and DROPS the classic
      # --output-signature / --output-certificate outputs GoReleaser's `signs`
      # block relies on (verified locally against v3.0.6 — it errors "create
      # bundle file"; v2.6.3 produces the .sig/.pem GoReleaser expects). Moving to
      # the cosign v3 bundle format is a deferred modernization, not this release.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.3

      # On a pushed tag: a real, published release. On manual dispatch: a
      # --snapshot dry-run (builds + signs + attests, publishes nothing). Snapshot
      # still runs the `signs:` block, so keyless cosign is exercised for real.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # PINNED (hygiene batch, 2026-09-08). This is the tool that
          # builds, packages, signs the checksum manifest and emits the
          # SBOMs for the six published headless targets, so it gets the
          # exact-version treatment the cosign BINARY already has one
          # step above (`cosign-release: v2.6.3`).
          #
          # A first draft of this comment said "cosign and syft already
          # have, three steps above". Both halves were false and are
          # corrected rather than softened: the Install Syft step above
          # carries NO `with:` block at all, so the syft BINARY version
          # is not declared anywhere in this workflow — only the ACTION
          # is SHA-pinned — and cosign is ONE step above, not three.
          # Pinning the syft binary is FILED; it is a different step
          # and a different decision.
          #
          # 2.18.0 is the version that produced the last green release,
          # READ FROM ITS LOG and not from memory: run 33427617674
          # (2026-08-31, tag v0.14.1, conclusion success) logged
          # "Downloading https://github.com/goreleaser/goreleaser/releases/download/v2.18.0/goreleaser_Linux_x86_64.tar.gz"
          # and then ran /opt/hostedtoolcache/goreleaser-action/2.18.0/x64/goreleaser.
          #
          # Two things this pin does NOT claim. (1) It reproduces the
          # BINARY of that run, not the whole step: the action itself
          # moved from v7.0.0 (ec59f47) to v7.2.3 in 7bc1972 after that
          # release, so the step is not byte-identical to the green one.
          # (2) The action's checksum and cosign verification of what it
          # downloads is conditional, not unconditional — both skip with
          # a warning if checksums.txt or the sigstore bundle cannot be
          # fetched, and the cosign half skips entirely if cosign is not
          # on PATH (it is here: the installer step runs above).
          #
          # What the exact pin DOES buy, beyond freezing the version:
          # with a valid semver the action's VERSION RESOLUTION builds
          # the tag and returns without a network call (the download of
          # the binary itself still happens, from github.com), while a
          # RANGE ('~> v2') first downloads
          # https://goreleaser.com/releases.json and picks with
          # semver.maxSatisfying — delegating, at run time, the choice of
          # which binary signs our release to a host that is not
          # github.com. Read in src/github.ts at the pinned SHA.
          version: '2.18.0'
          args: ${{ github.event_name == 'workflow_dispatch' && 'release --snapshot --clean' || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SLSA build provenance for the checksum file (ADR-0026 fast-follow). Signing
      # checksums.txt already covers integrity of every artifact transitively; this
      # attestation records HOW/WHERE it was built (SLSA Build L3 via OIDC), so the
      # single subject is the checksum file — no per-binary fan-out needed.
      #
      # Real releases only (tag push): GitHub CANNOT persist attestations for
      # user-owned PRIVATE repos ("Feature not available for user-owned private
      # repositories"), so it would fail a snapshot dry-run while the repo is
      # private. By the first real release the repo is public (Phase B flip
      # precedes the Phase C tag), where attestation works. A dispatch dry-run
      # attesting a throwaway snapshot checksum would be meaningless anyway.
      - name: Attest build provenance
        if: github.event_name == 'push'
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/checksums.txt

      # The attestation lives in GitHub's store (gh attestation verify), but
      # verifiers — human and machine (Scorecard Signed-Releases) — also get
      # the SAME in-toto provenance as a release asset: the Sigstore bundle
      # wraps a DSSE-signed in-toto SLSA provenance statement, uploaded under
      # the canonical .intoto.jsonl suffix. Verification: SECURITY.md.
      - name: Upload provenance bundle to the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" korvun_checksums_provenance.intoto.jsonl
          gh release upload "$GITHUB_REF_NAME" korvun_checksums_provenance.intoto.jsonl