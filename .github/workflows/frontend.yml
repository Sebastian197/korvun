# Frontend CI: the builder (Stage 14 Phase 2b) and the desktop chrome (SP6).
# SEPARATE from the Go pipeline so Node flakiness never gates the quality
# matrix, the cross-compile x6, or the release (ADR-0029 §6). Path-filtered so
# a Go-only change does not run it.
name: Frontend

on:
  push:
    # master + the "ensayo" rehearsal branch (see quality.yml's note).
    branches: [master, ensayo]
    paths:
      [
        "web/builder/**",
        "cmd/korvun-desktop/frontend/**",
        "cmd/korvun-desktop/e2e-harness/**",
        ".github/workflows/frontend.yml",
      ]
  pull_request:
    paths:
      [
        "web/builder/**",
        "cmd/korvun-desktop/frontend/**",
        "cmd/korvun-desktop/e2e-harness/**",
        ".github/workflows/frontend.yml",
      ]

permissions:
  contents: read

jobs:
  frontend:
    name: builder (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/builder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/builder/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Coverage (v8) with thresholds instead of a bare run — untested builder
      # code fails the job, not just the reader (same rule as the chrome job).
      - run: npm run coverage
      # The build regenerates dist/ fresh (never trusts a committed one, ADR-0029 §6)
      # and is the artifact the Go binary embeds via go:embed.
      - run: npm run build

  e2e:
    name: builder e2e (Playwright · mock control API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/builder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/builder/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Flow + rejections + ECONNREFUSED-during-cutover + axe-core + no-same-origin
      # guard. Separate from the Go pipeline — never gates cross-compile / release.
      - run: npm run e2e

  chrome:
    name: chrome (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cmd/korvun-desktop/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cmd/korvun-desktop/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Coverage (v8) with thresholds instead of a bare run — untested chrome
      # code fails the job, not just the reader (6a review rider + SP6b
      # review hardening).
      - run: npm run coverage
      - run: npm run build

  chrome-e2e:
    name: chrome e2e (Playwright · SP4 proxy + real no-network core)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cmd/korvun-desktop/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cmd/korvun-desktop/frontend/package-lock.json
      # The e2e webServer is the Go harness (built chrome + SP4 proxy + the
      # SP5 channel-less template on a real Controller) — Go is required.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: npm ci
      # Cache the Playwright browser bundle keyed on the pinned
      # @playwright/test version (6a review rider): on a hit the install
      # step below skips the ~100 MB Chromium download and only installs
      # the OS deps. actions/cache v6.1.0 verified at source 2026-07-25.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('cmd/korvun-desktop/frontend/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # The harness's core embeds web/builder/dist via go:embed; build it fresh
      # so the /builder/ iframe serves the REAL builder, not the committed
      # placeholder — the SP4/SP6 canvas e2e drive the real builder in the frame.
      - name: Build embedded builder dist
        working-directory: web/builder
        run: npm ci && npm run build
      # Pre-compile the harness so its cold build (modernc.org/sqlite tree)
      # never eats into Playwright's webServer timeout on a cache miss.
      - run: go build -o /dev/null ../e2e-harness
      - run: npm run e2e
